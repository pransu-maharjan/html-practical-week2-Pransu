<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pransu | Contact</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f8fc;
            color: #172033;
            line-height: 1.6;
        }

        nav {
            background: white;
            padding: 18px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        nav a {
            text-decoration: none;
            color: #172033;
            font-weight: bold;
            margin: 0 15px;
        }

        nav a:hover {
            color: #5b5cf0;
        }

        main {
            max-width: 900px;
            margin: auto;
            padding: 50px 25px;
        }

        h1 {
            font-size: 50px;
            color: #5b5cf0;
        }

        .form-box {
            background: white;
            padding: 35px;
            border-radius: 20px;
            border: 1px solid #e2e5ec;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            margin-top: 7px;
            border: 1px solid #dce0e8;
            border-radius: 10px;
            font-size: 15px;
        }

        textarea {
            height: 130px;
            resize: vertical;
        }

        fieldset {
            margin-top: 20px;
            border: 1px solid #dce0e8;
            border-radius: 10px;
            padding: 15px;
        }

        fieldset label {
            display: inline-block;
            margin-right: 20px;
            font-weight: normal;
        }

        fieldset input {
            width: auto;
            margin-right: 5px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            border: none;
            border-radius: 10px;
            background: #5b5cf0;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4445d0;
        }

        .contact-info {
            margin-top: 35px;
            background: white;
            padding: 25px;
            border-radius: 18px;
        }

        footer {
            text-align: center;
            padding: 25px;
            background: white;
            border-top: 1px solid #ddd;
            color: #647087;
        }
    </style>
</head>

<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>

    <main>

        <h1>Student Registration</h1>

        <p>
            Please fill in the form below to register your
            student information.
        </p>

        <div class="form-box">

            <form>

                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >

                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <fieldset>

                    <legend><strong>Gender</strong></legend>

                    <label>
                        <input type="radio" name="gender" required>
                        Male
                    </label>

                    <label>
                        <input type="radio" name="gender">
                        Female
                    </label>

                    <label>
                        <input type="radio" name="gender">
                        Other
                    </label>

                </fieldset>

                <fieldset>

                    <legend><strong>Interests</strong></legend>

                    <label>
                        <input type="checkbox">
                        Programming
                    </label>

                    <label>
                        <input type="checkbox">
                        Web Development
                    </label>

                    <label>
                        <input type="checkbox">
                        Database
                    </label>

                </fieldset>

                <label for="department">Department</label>

                <select id="department" required>

                    <option value="">Select Department</option>
                    <option>Computer Science</option>
                    <option>Information Technology</option>
                    <option>Software Engineering</option>
                    <option>Business Administration</option>
                    <option>Data Science</option>

                </select>

                <label for="about">About You</label>

                <textarea
                    id="about"
                    placeholder="Tell us about yourself">
                </textarea>

                <button type="submit">
                    Submit Registration
                </button>

            </form>

        </div>

        <div class="contact-info">

            <h2>Contact Me</h2>

            <p>Email: pransu@email.com</p>
            <p>Location: Lalitpur, Nepal</p>

        </div>

    </main>

    <footer>
        <p>© 2026 Pransu Maharjan | Personal Portfolio</p>
    </footer>

</body>
</html>
