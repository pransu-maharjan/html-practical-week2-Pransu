<!DOCTYPE html>
<html>
<head>
    <title>My Media Hub</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        h1 {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>

<body>

    <h1>My Media Hub</h1>

    <h2>YouTube Video</h2>

    <iframe width="560" height="315"
        src="https://youtube.com/embed/KEXZREwKipY?si=ksAmrwp6y6KE8g57"
        title="YouTube Video"
        allowfullscreen>
    </iframe>

    <h2>Local Video</h2>

    <video width="500" controls>
        <source src="Pransu.mp4" type="video/mp4">
        <source src="Pransu.webm" type="video/webm">
        Your browser does not support the video tag.
    </video>

    <h2>Audio</h2>

    <audio controls>
        <source src="audio.mp3" type="audio/mpeg">
        Your browser does not support the audio tag.
    </audio>

    <h2>Google Map</h2>

    <iframe
        src="https://www.google.com/maps?q=PCPS+College+Kupondole&output=embed"
        width="600"
        height="450">
    </iframe>

    <h2>External Webpage</h2>

    <iframe
        src="https://www.wikipedia.org"
        width="600"
        height="400">
    </iframe>

    <h2>PDF Document</h2>

    <embed src="Pransu Maharjan.pdf" type="application/pdf"
           width="600" height="500">

</body>
</html>
